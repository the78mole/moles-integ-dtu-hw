name: Generate Production Files

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach files to (optional)"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  generate-production-files:
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/the78mole/kicaddev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate production files
        run: |
          echo "Starting production file generation..."
          ls -la
          echo "Project files found:"
          find . -name "*.kicad_*" -type f
          
          # Run the kicad export script
          kicad_export ./Moles-Integ-DTU-HW.kicad_pro
          
          echo "Production files generated:"
          find ./production -type f
          
      - name: Create production archive
        run: |
          cd production
          # Create a comprehensive production archive
          zip -r "../Moles-Integ-DTU-HW-production-${{ github.event.release.tag_name || inputs.release_tag || "manual" }}.zip" .
          cd ..
          
      - name: Upload production files to release
        if: github.event_name == "release"
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./Moles-Integ-DTU-HW-production-${{ github.event.release.tag_name }}.zip
            ./production/Moles-Integ-DTU-HW_manufacturing.zip
            ./production/bom/Moles-Integ-DTU-HW_ibom.html
            ./production/pdf/Moles-Integ-DTU-HW_schematic.pdf
            ./production/pdf/Moles-Integ-DTU-HW_pcb.pdf
            ./production/3d/Moles-Integ-DTU-HW.step
          tag_name: ${{ github.event.release.tag_name }}
          
      - name: Upload artifacts for manual runs
        if: github.event_name == "workflow_dispatch"
        uses: actions/upload-artifact@v4
        with:
          name: production-files-${{ inputs.release_tag || github.sha }}
          path: |
            production/
            Moles-Integ-DTU-HW-production-*.zip
          retention-days: 30
